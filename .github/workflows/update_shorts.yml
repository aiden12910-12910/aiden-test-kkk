name: GitHub 自动爬取短视频

on:
  schedule:
    - cron: '0 */3 * * *' # 每 3 小时全自动运行一次
  workflow_dispatch:      # 允许你在网页上手动点击按钮立即刷新

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4

    - name: 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安装强力防封版依赖
      run: |
        python -m pip install --upgrade pip
        # ⭐ 改用官方源标准安装，绝对不会报后缀或解压错误
        pip install --no-cache-dir --upgrade yt-dlp

    - name: 运行云端爬虫
      run: python scraper.py

    - name: 自动提交更新到 GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Actions 自动刷新视频流数据" && git push)
